services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: crm
      POSTGRES_DB: crmassistant
    ports:
      - "5432:5432"
    volumes:
      - crm_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm -d crmassistant"]
      interval: 3s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      POSTGRES_URL: postgresql+asyncpg://crm:crm@db:5432/crmassistant
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-use-long-random-string}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@crmassist.dev}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
    depends_on:
      db:
        condition: service_healthy

volumes:
  crm_pgdata:
